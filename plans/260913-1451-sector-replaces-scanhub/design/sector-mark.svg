<!-- Sector: the phased-array wedge, the shape of the image itself.
     Apex (16,3), half angle 27 degrees, footprint radius 3.5, depth radius 27,
     so it is taller than wide the way a real sector scan is.
     fill=currentColor, so it takes the accent token from whatever mounts it.
     (No double hyphens in this comment: XML forbids them inside one, and a
     token name spelled out here silently breaks the whole file.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sector">
  <path fill="currentColor" d="M14.41 6.12 L17.59 6.12 L28.26 27.06 A27 27 0 0 1 3.74 27.06 Z"/>
</svg>
