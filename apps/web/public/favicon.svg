<!-- Sector favicon. Carries its own scan-ground tile rather than a bare wedge
     on transparency: browser chrome is light in one theme and dark in the
     other, and a single-colour mark loses one of them at 16px.
     The wedge is scaled to 0.95 rather than sized for comfort, because the
     depth arc is the only thing distinguishing this from a triangle and it is
     the first detail to go as the icon shrinks. It resolves from about 24px;
     at 16px the mark reads as a wedge, which is the most any favicon does.
     (No double hyphens in this comment. XML forbids them inside one, and a
     token name spelled out here silently breaks the whole file.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sector">
  <rect width="32" height="32" rx="6" fill="#14120F"/>
  <path fill="#EE7625" transform="translate(16 16) scale(0.95) translate(-16 -16.5)"
        d="M14.41 6.12 L17.59 6.12 L28.26 27.06 A27 27 0 0 1 3.74 27.06 Z"/>
</svg>
