<!-- Sector favicon. Carries its own scan-ground square rather than a bare
     wedge on transparency: browser chrome is light in one theme and dark in
     the other, and a single-colour mark loses one of them at 16px.
     (No double hyphens in this comment. XML forbids them inside one, and a
     token name spelled out here silently breaks the whole file.) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sector">
  <rect width="32" height="32" rx="7" fill="#14120F"/>
  <g transform="translate(16 16) scale(0.8) translate(-16 -16.5)">
    <path fill="#EE7625" d="M14.41 6.12 L17.59 6.12 L28.26 27.06 A27 27 0 0 1 3.74 27.06 Z"/>
  </g>
</svg>
